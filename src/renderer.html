<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>狐朦桌宠</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="pet-shell" id="pet-shell">
        <button class="pet" id="pet" aria-label="和狐朦互动">
          <span class="pet-shadow"></span>
          <img class="pet-art" id="pet-art" src="./assets/humeng-guard.png" alt="站岗中的狐朦" draggable="false" />
        </button>
        <div class="bubble hidden" id="bubble"></div>
      </section>
      <section class="dialogue-modal hidden" id="dialogue-modal" aria-label="管理励志语录">
        <div class="dialogue-card" role="dialog" aria-modal="true" aria-labelledby="dialogue-title">
          <div class="dialogue-heading">
            <h1 id="dialogue-title">添加对话</h1>
            <button class="dialogue-close" id="dialogue-close" type="button" aria-label="关闭">×</button>
          </div>
          <form class="dialogue-form" id="dialogue-form">
            <textarea id="dialogue-input" maxlength="160" placeholder="写下一句想让狐朦说的话…" aria-label="新对话"></textarea>
            <button type="submit">添加</button>
          </form>
          <p class="dialogue-error hidden" id="dialogue-error" role="alert"></p>
          <div class="dialogue-list" id="dialogue-list"></div>
        </div>
      </section>
      <section class="dialogue-modal hidden" id="duration-modal" aria-label="录入剩余工作时长">
        <div class="dialogue-card" role="dialog" aria-modal="true" aria-labelledby="duration-title">
          <div class="dialogue-heading">
            <h1 id="duration-title">剩余工作时长</h1>
            <button class="dialogue-close" id="duration-close" type="button" aria-label="关闭">×</button>
          </div>
          <form class="dialogue-form" id="duration-form">
            <label class="duration-label" for="duration-input">分钟（1–480）</label>
            <input id="duration-input" type="number" min="1" max="480" step="1" placeholder="例如 25" inputmode="numeric" required />
            <button type="submit">开始倒计时</button>
          </form>
          <p class="dialogue-error hidden" id="duration-error" role="alert"></p>
        </div>
      </section>
      <section class="dialogue-modal hidden" id="schedule-modal" aria-label="设置工作安排">
        <div class="dialogue-card" role="dialog" aria-modal="true" aria-labelledby="schedule-title">
          <div class="dialogue-heading">
            <h1 id="schedule-title">工作安排</h1>
            <button class="dialogue-close" id="schedule-close" type="button" aria-label="关闭">×</button>
          </div>
          <form class="dialogue-form" id="schedule-form">
            <div class="schedule-grid">
              <label for="schedule-work-input">工作时间（分钟）</label>
              <input id="schedule-work-input" type="number" min="1" max="480" step="1" inputmode="numeric" required />
              <label for="schedule-followup-input">再次提醒间隔（分钟）</label>
              <input id="schedule-followup-input" type="number" min="1" max="480" step="1" inputmode="numeric" required />
              <label for="schedule-break-input">休息时间（分钟）</label>
              <input id="schedule-break-input" type="number" min="1" max="480" step="1" inputmode="numeric" required />
            </div>
            <button type="submit">保存安排</button>
          </form>
          <p class="dialogue-error hidden" id="schedule-error" role="alert"></p>
        </div>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
